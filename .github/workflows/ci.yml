name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: scripts/format.sh --check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang-tidy-18
      - run: cmake --preset dev
      - run: scripts/lint.sh build/dev

  build-test:
    name: build-test (${{ matrix.os }}, ${{ matrix.cxx }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        cxx: [g++-13, g++-14, clang++-18]
        preset: [dev, release]
        include:
          # arm64's weaker memory model exposes ordering bugs that x86-64 hides; release adds
          # compiler reordering on top of hardware reordering.
          - { os: ubuntu-24.04-arm, cxx: g++-13, preset: dev }
          - { os: ubuntu-24.04-arm, cxx: g++-13, preset: release }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - name: No shared-memory segments left behind
        run: "! ls /dev/shm | grep '^revenant\\.'"

  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake --preset release
      - run: cmake --build --preset release --target ticker_publisher ticker_subscriber revenant-stat
      - name: kill -9 the publisher; the standby must take over with no gap
        run: examples/kill_demo.sh build/release

  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake --preset bench
      - run: cmake --build --preset bench
      - name: Smoke run (shared runners are too noisy for published numbers)
        run: |
          build/bench/bench/bench_latency_pingpong --iterations=10000
          build/bench/bench/bench_fanout --messages=10000 --max-subscribers=2
          build/bench/bench/bench_recovery --iterations=20

  sanitizers:
    name: sanitizers (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Lower ASLR entropy (TSan cannot map its shadow memory otherwise)
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - name: No shared-memory segments left behind
        run: "! ls /dev/shm | grep '^revenant\\.'"
