name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install tools
        run: pip3 install pre-commit cmake-format codespell

      - name: clang-format check
        run: |
          find include src tests -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \
            | xargs clang-format-18 --dry-run --Werror --style=file

      - name: cmake-format check
        run: cmake-format --check CMakeLists.txt tests/CMakeLists.txt

      - name: codespell
        run: codespell include/ src/ docs/ --skip="*.pc,*.pc.in" --quiet-level=2

      - name: shellcheck
        run: |
          find scripts .githooks -type f | xargs file | grep 'shell script' \
            | cut -d: -f1 | xargs shellcheck --severity=warning || true

      - name: Check no raw std::memory_order at call sites
        run: |
          if grep -r "memory_order_" include/revenant/core include/revenant/liveness \
               --include="*.hpp" \
               --exclude="atomics.hpp"; then
            echo "ERROR: raw std::memory_order found outside atomics.hpp" >&2
            exit 1
          fi

      - name: check layout offsets
        run: |
          python3 scripts/check_layout_offsets.py

  # --------------------------------------------------------------------------
  build:
    name: "Build (${{ matrix.compiler }}, ${{ matrix.build_type }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc-13,   cc: gcc-13,   cxx: g++-13,      build_type: Debug,   image: "ghcr.io/ellay21/revenant-ci@sha256:7ec9e10579cacee9ad99d34012b13cf646fde088dde1f9438c9fec7d4f5793eb" }
          - { compiler: gcc-13,   cc: gcc-13,   cxx: g++-13,      build_type: Release, image: "ghcr.io/ellay21/revenant-ci@sha256:7ec9e10579cacee9ad99d34012b13cf646fde088dde1f9438c9fec7d4f5793eb" }
          - { compiler: clang-18, cc: clang-18, cxx: clang++-18,  build_type: Debug,   image: "ghcr.io/ellay21/revenant-ci@sha256:63ea11ad898a4cad24265770b69f00e2e6f2b4dc0724452a94061bea0031b35e" }
          - { compiler: clang-18, cc: clang-18, cxx: clang++-18,  build_type: Release, image: "ghcr.io/ellay21/revenant-ci@sha256:63ea11ad898a4cad24265770b69f00e2e6f2b4dc0724452a94061bea0031b35e" }

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build
          key: "${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}"
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-
            ${{ runner.os }}-${{ matrix.compiler }}-


      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DREVENANT_BUILD_TESTS=ON \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build/ci --parallel $(nproc)

  # --------------------------------------------------------------------------
  headers:
    name: Header Self-Containment
    runs-on: ubuntu-24.04
    container: ghcr.io/ellay21/revenant-ci@sha256:63ea11ad898a4cad24265770b69f00e2e6f2b4dc0724452a94061bea0031b35e
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Generate per-header TUs and compile
        run: |
          BUILD_DIR="build/header-check"
          cmake -S . -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=20 \
            -DREVENANT_BUILD_TESTS=OFF \
            -DCMAKE_CXX_COMPILER=clang++-18 > /dev/null
          cmake --build "${BUILD_DIR}" --parallel $(nproc) > /dev/null

          FAILED=0
          for hdr in $(find include/revenant -name '*.hpp' | sort); do
            rel="${hdr#include/}"
            TU="$(mktemp /tmp/hdr_check_XXXXXX.cpp)"
            echo "#include <${rel}>" > "${TU}"
            if ! clang++-18 -std=c++20 -Wall -Werror \
                -I"include" -I"${BUILD_DIR}/include" \
                -c "${TU}" -o /dev/null 2>/tmp/hdr_err.txt; then
              echo "FAIL: ${rel}"
              cat /tmp/hdr_err.txt
              FAILED=1
            fi
            rm -f "${TU}"
          done
          exit ${FAILED}

  # --------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    container: ghcr.io/ellay21/revenant-ci@sha256:7ec9e10579cacee9ad99d34012b13cf646fde088dde1f9438c9fec7d4f5793eb
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=Debug \
            -DREVENANT_BUILD_TESTS=ON \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build/ci --parallel $(nproc)

      - name: Run unit + property tests
        run: |
          ctest --test-dir build/ci -L "unit|property" \
            --output-on-failure \
            --output-junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results
          path: test-results.xml

  # --------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    container: ghcr.io/ellay21/revenant-ci@sha256:7ec9e10579cacee9ad99d34012b13cf646fde088dde1f9438c9fec7d4f5793eb
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install gcovr
        run: |
          apt-get update -qq
          pip3 install gcovr --break-system-packages

      - name: Configure with coverage
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build/coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DREVENANT_BUILD_TESTS=ON \
            -DREVENANT_ENABLE_COVERAGE=ON \
            -DCMAKE_CXX_STANDARD=20

      - name: Build and test
        run: |
          cmake --build build/coverage --parallel $(nproc)
          ctest --test-dir build/coverage -L "unit|property" --output-on-failure

      - name: Report coverage
        run: |
          gcovr --root . \
            --filter "include/revenant/core/" \
            --filter "include/revenant/liveness/" \
            --txt --xml coverage.xml \
            --fail-under-line 90
        continue-on-error: true  # report but don't block until P3

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage.xml

  # --------------------------------------------------------------------------
  packaging:
    name: Packaging Consumers
    runs-on: ubuntu-24.04
    container: ghcr.io/ellay21/revenant-ci@sha256:7ec9e10579cacee9ad99d34012b13cf646fde088dde1f9438c9fec7d4f5793eb
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run packaging tests
        env:
          CC: gcc-13
          CXX: g++-13
        run: bash tests/packaging/run.sh
